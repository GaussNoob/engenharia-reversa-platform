name: nucleo-production
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:5549:5432"]
    environment:
      POSTGRES_USER: nucleo
      POSTGRES_DB: nucleo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nucleo -d nucleo"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
secrets:
  postgres_password:
    file: /etc/nucleo/postgres-password
volumes:
  postgres-data:
