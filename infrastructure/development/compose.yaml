name: nucleo
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:5549:5432"]
    environment:
      POSTGRES_USER: nucleo
      POSTGRES_DB: nucleo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["nucleo-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nucleo -d nucleo"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  nucleo-postgres:
