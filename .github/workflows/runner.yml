name: Linux sandbox integration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runner-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nucleo
          POSTGRES_DB: nucleo
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5549:5432"]
        options: >-
          --health-cmd "pg_isready -U nucleo -d nucleo"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://nucleo_app:ci-app-password@127.0.0.1:5549/nucleo
      RUNNER_DATABASE_URL: postgresql://nucleo_runner:ci-runner-password@127.0.0.1:5549/nucleo
      MIGRATION_DATABASE_URL: postgresql://nucleo:ci-only-password@127.0.0.1:5549/nucleo
      BETTER_AUTH_SECRET: ephemeral-ci-auth-secret-at-least-32-characters
      PUBLIC_ORIGIN: http://localhost:3050
      NATIVE_CLIENTS_ENABLED: "true"
      RUNNER_ENABLED: "true"
      RUNNER_DOCKER_RUNTIME: runsc
      RUNNER_ALLOW_RUNC: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: npm ci
      - name: Prepare study content and model
        run: |
          python -m pip install -r scripts/requirements-analysis.txt
          git clone https://github.com/mentebinaria/fundamentos-engenharia-reversa.git references/fundamentos-engenharia-reversa
          git -C references/fundamentos-engenharia-reversa checkout 3d24fc9313560d734d7a27c56c53d695f01163e1
          npm run content:import
          npm run runner:build
          mkdir -p .runtime
      - name: Install verified gVisor in this ephemeral runner
        run: sudo env GVISOR_RELEASE=20260928.0 bash infrastructure/setup-gvisor.sh
      - name: Build isolated execution images
        run: |
          docker build -f infrastructure/runner-images/Dockerfile --target compiler -t nucleo-compiler:local .
          docker build -f infrastructure/runner-images/Dockerfile --target python -t nucleo-python:local .
          docker build -f infrastructure/runner-images/Dockerfile --target native -t nucleo-native:local .
          docker build -f infrastructure/runner-images/Dockerfile --target model -t nucleo-model:local .
      - name: Migrate and start services as the unprivileged runner user
        run: |
          node --import tsx apps/api/src/db/migrate.ts
          node --import tsx apps/api/src/db/seed.ts
          node --import tsx apps/api/src/main.ts > .runtime-api.log 2>&1 &
          node --import tsx apps/runner/src/main.ts > .runtime-runner.log 2>&1 &
          node --input-type=module -e 'for(let i=0;i<60;i++){try{if((await fetch("http://127.0.0.1:3060/api/health")).ok)process.exit(0);}catch{} await new Promise(r=>setTimeout(r,500));}process.exit(1);'
      - run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: runner-integration-diagnostics
          include-hidden-files: true
          path: |
            .runtime-api.log
            .runtime-runner.log
          retention-days: 7
