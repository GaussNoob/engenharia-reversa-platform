name: Mobile packages
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      api_origin:
        description: "HTTPS API origin for this build; blank uses NUCLEO_API_URL"
        type: string
        required: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env: { NUCLEO_API_URL: "${{ inputs.api_origin || vars.NUCLEO_API_URL }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: node scripts/version-release.mjs
      - run: npm run assets:prepare
      - run: npm run build:mobile
      - name: Sync Android
        working-directory: apps/mobile
        run: npx cap sync android
      - name: Build APK and unsigned AAB
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-and-unsigned-aab
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
