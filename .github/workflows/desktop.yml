name: Desktop installers
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      api_origin:
        description: "HTTPS API origin for this build; blank uses NUCLEO_API_URL"
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix: { os: [windows-latest, ubuntu-22.04, macos-latest] }
    runs-on: ${{ matrix.os }}
    env:
      NUCLEO_API_URL: ${{ inputs.api_origin || vars.NUCLEO_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "apps/desktop/src-tauri -> target" }
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev libfuse2 libxdo-dev
      - run: npm ci
      - run: node scripts/version-release.mjs
      - run: npm run assets:prepare
      - run: npm run build:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-unsigned
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
